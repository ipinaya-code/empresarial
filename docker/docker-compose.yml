# Laboratorio local. No es un manifiesto de producción.
name: empresarial
services:
  db:
    image: docker.io/library/postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boa_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-lab-only}
      POSTGRES_DB: ${POSTGRES_DB:-boa_reservas}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5455}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
  valkey:
    image: docker.io/valkey/valkey:8-alpine
    # Solo accesible por la red interna de Compose.
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    image: localhost/boa-reservas:dev
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      APP_ENV: development
      APP_DEBUG: "false"
      DEMO_ROUTES_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-boa_admin}:${POSTGRES_PASSWORD:-local-lab-only}@db:5432/${POSTGRES_DB:-boa_reservas}
      VALKEY_URL: redis://valkey:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-false}
      READ_MODE: ${READ_MODE:-refactored}
      SECURE_LOCK_DELAY_SECONDS: "0"
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: [sh, -c, 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2']
volumes:
  db_data:
