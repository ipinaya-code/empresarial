repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: black
        name: black check
        entry: .venv/bin/black --check
        language: system
        types: [python]
      - id: docs
        name: Markdown local links
        entry: .venv/bin/python scripts/check_docs.py
        language: system
        pass_filenames: false
        files: '\.md$'
