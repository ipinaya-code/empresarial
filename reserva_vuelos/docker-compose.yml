version: '3.8'

services:
  db:
    image: docker.io/library/postgres:15
    container_name: postgres-reserva-compose
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: reservas_db
    ports:
      - "5455:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: .
    container_name: reserva-api-compose
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin@db:5432/reservas_db
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
