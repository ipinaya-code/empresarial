name: Quality and laboratory validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: boa_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: boa_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U boa_test -d boa_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      APP_DEBUG: "false"
      TEST_DATABASE_URL: postgresql+psycopg2://boa_test:local-test-only@127.0.0.1:55432/boa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-browser.lock
      - name: Install fixed dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-browser.lock
          .venv/bin/pip install --no-deps -e .
      - name: Quality and SQLite contracts
        run: make check
      - name: PostgreSQL invariants
        run: make test-postgres
      - name: Migration roundtrip on empty test database
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
      - name: Build and deploy isolated local laboratory
        run: make compose-up CONTAINER_ENGINE=docker
      - name: Readiness
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Browser smoke
        run: |
          .venv/bin/playwright install --with-deps chromium
          make test-browser
      - name: Preserve container logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f docker/docker-compose.yml logs --no-color > artifacts/compose.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: artifacts/
          retention-days: 14
      - name: Stop laboratory
        if: always()
        run: docker compose -f docker/docker-compose.yml down
