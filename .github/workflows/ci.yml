# ─────────────────────────────────────────────────────────────
# CI Pipeline — Sistema de Reservas BoA
# Se ejecuta en cada Push y Pull Request
# ─────────────────────────────────────────────────────────────
name: CI — Lint, Test & Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_USER: boa_test
  POSTGRES_PASSWORD: boa_test_pass
  POSTGRES_DB: boa_test_db

jobs:
  # ────────────────────────────────────────────────────────────
  #  1. Lint & Format Check
  # ────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar herramientas de lint
        run: pip install ruff black mypy

      - name: Ruff (Linter)
        run: ruff check app/ tests/ --output-format=github

      - name: Black (Formatter check)
        run: black --check --diff app/ tests/

      - name: MyPy (Type check)
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # Warning, no bloquea el CI por ahora

  # ────────────────────────────────────────────────────────────
  #  2. Tests unitarios e integración
  # ────────────────────────────────────────────────────────────
  test:
    name: 🧪 Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: boa_test
          POSTGRES_PASSWORD: boa_test_pass
          POSTGRES_DB: boa_test_db
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U boa_test -d boa_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      valkey:
        image: valkey/valkey:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://boa_test:boa_test_pass@localhost:5455/boa_test_db
      VALKEY_URL: redis://localhost:6379/0
      APP_ENV: development
      SECURE_LOCK_DELAY_SECONDS: 2
      INSECURE_DELAY_SECONDS: 0.1

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache de dependencias pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ejecutar tests con cobertura
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -v

      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────────────────────────────────────────────────────
  #  3. Build de imagen Docker
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t boa-reservas-api:ci .

      - name: Verificar imagen
        run: docker images boa-reservas-api:ci
